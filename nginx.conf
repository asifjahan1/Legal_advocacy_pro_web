server {
    listen 80;
    
    # Vite বিল্ড ফাইল যেখানে থাকবে
    root /usr/share/nginx/html;
    index index.html;

    # React Router ফিক্স (রিফ্রেশ করলে 404 আসবে না)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ক্যাশিং (সাইট ফাস্ট লোড হবে)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}